[package]
name = "kamism"
version = "0.1.3"
description = "KamiSM - 卡密管理系统"
authors = ["zf26"]
edition = "2021"
default-run = "kamism"

[lib]
name = "kamism_lib"
# 只保留 rlib。
#
# 原值是 Tauri 模板默认的 ["staticlib", "cdylib", "rlib"]，其中 staticlib / cdylib
# 只服务于 iOS / Android 移动端；Windows 桌面端（src/main.rs 调 kamism_lib::run()）
# 与 server crate 都只链接 rlib（见 server/Cargo.toml 的 default-features = false）。
#
# 在 Windows + GNU 工具链（x86_64-pc-windows-gnu）下构建 cdylib 必然失败：
# MinGW 的 ld 默认对 DLL 开启「导出全部符号」，而 kamism 链接了 sqlx / aws-lc-rs /
# ring / lettre 等大量依赖，导出符号数达到 15 万，远超 PE 格式 DLL 的 ordinal
# 上限 65535，报错：
#     ld.exe: error: export ordinal too large: 150371
# 因此移除 cdylib 与 staticlib。将来要出移动端时再加回来
# （移动端只在 macOS / Linux 上构建，不会撞到这个 Windows-only 的限制）。
crate-type = ["rlib"]

[features]
default = []
# tauri feature：桌面客户端编译时启用，服务器端不需要
desktop = ["tauri", "tauri-plugin-opener", "tauri-plugin-shell", "tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
# Tauri（仅桌面客户端需要）
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-shell = { version = "2", optional = true }

# Web 框架
axum = { version = "0.7", features = ["macros", "ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "compression-br", "limit", "catch-panic"] }
futures-util = { version = "0.3", features = ["sink"] }

# 数据库
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 认证
jsonwebtoken = "9"
bcrypt = "0.15"

# 工具
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
rand = "0.8"
base32 = "0.4"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
regex = "1"

# 邮件
lettre = { version = "0.11", features = ["tokio1-native-tls", "smtp-transport", "builder"] }

# Redis（验证码存储）
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# RabbitMQ（异步降级任务）
lapin = "4"
futures-lite = "2"

# 加密
aes-gcm = "0.10"
hex = "0.4"
sha2 = { version = "0.10", features = ["oid"] }
hmac = "0.12"
base64 = "0.22"

# HTTP 客户端（Webhook 推送、OAuth）
reqwest = { version = "0.12", features = ["json"] }

# 支付签名
md5 = "0.7"
bytes = "1"
# 支付宝 RSA2 签名
rsa = { version = "0.9", features = ["pem", "hazmat"] }
pkcs8 = { version = "0.7", features = ["pem"] }
urlencoding = "2"
