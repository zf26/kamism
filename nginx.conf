# WebSocket 升级头映射
#
# 缺少这一段时，前端 `new WebSocket('/api/ws/messages')` 的握手会被当成普通
# HTTP 请求转发给后端，后端不会返回 101 Switching Protocols，实时推送永远连不上
# （表现为商户端收不到激活通知、站内信未读提醒不刷新，而浏览器只报握手失败）。
# 注意：map 必须放在 http 上下文，conf.d/*.conf 正是被包含在 http 里的。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端 SPA：所有路由回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理后端 API（去掉 /api 前缀转发给后端容器）
    location /api/ {
        proxy_pass http://app:9527/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 注意：$proxy_add_x_forwarded_for 会在客户端自带的 X-Forwarded-For 后面追加
        # Nginx 看到的对端地址，形如「<客户端可伪造的>, <真实客户端IP>」。
        # 后端只在对端属于 TRUSTED_PROXIES 时才读这个头，并从右往左取第一个非可信项，
        # 所以左边那些伪造值不会生效。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 握手：把连接升级为长连接
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 实时推送需要长时间空闲连接，默认 60s 会在空闲时被掐断
        proxy_read_timeout 3600s;
        # 长连接/SSE 场景必须关闭缓冲，否则消息会被攒着不发
        proxy_buffering off;
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}
