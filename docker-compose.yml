# ══════════════════════════════════════════════
# KamiSM Docker Compose
# 单容器启动（推荐）：docker compose -f docker-compose.standalone.yml up -d --build
# 多容器启动：       docker compose up -d --build
# ══════════════════════════════════════════════

services:
  # ─── PostgreSQL ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kamism-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kamism
      POSTGRES_USER: kamism
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kamism -d kamism"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: kamism-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── RabbitMQ ────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-alpine
    container_name: kamism-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: kamism
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "sh", "-c", "rabbitmq-diagnostics ping && nc -z 127.0.0.1 5672"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ─── 后端服务（不对外暴露，由 Nginx 代理）────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kamism-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://kamism:${POSTGRES_PASSWORD}@postgres:5432/kamism
      REDIS_URL: redis://redis:6379
      AMQP_URL: amqp://kamism:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2f
      JWT_SECRET: ${JWT_SECRET}
      PORT: 9527
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:1420}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # 加密主密钥：必须显式提供。留空会让后端「临时生成一把」，容器一重建就换密钥，
      # 已加密字段（api_key / 邮箱 / 卡密 / 设备 ID）全部读不出来。要求必填 = 让问题
      # 在启动时就暴露，而不是等数据读不出来才发现。
      MASTER_KEY: ${MASTER_KEY:?请在 .env 中设置 MASTER_KEY（openssl rand -hex 32）}
      # 可信代理范围：必须与文件末尾 networks.default 里固定的网段一致。
      # 配错/留空的后果是限流退化成「全站共用一个 IP 的额度」，IP 黑名单也失效。
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.28.0.0/16}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-KamiSM}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      RUST_LOG: ${RUST_LOG:-info}
    expose:
      - "9527"

  # ─── 前端（Nginx 反代，统一对外暴露 1420）────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: /api
    container_name: kamism-web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${FRONTEND_PORT:-1420}:80"

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

# 固定默认网段：TRUSTED_PROXIES 的可信范围必须是一个确定的网段，
# 而 Docker 默认地址池（172.17/16、172.18/16…）是不确定的 —— 一旦实际网段
# 与配置不符，就会「看起来配了、其实没生效」（限流退化 + IP 黑名单失效）。
# 这里把网段钉死，两边的配置才对得上。
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
