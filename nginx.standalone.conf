# 单容器专用 Nginx 配置（proxy_pass 指向本机 127.0.0.1）

# WebSocket 升级头映射（没有它，/api/ws/messages 的握手不会被升级，实时推送连不上）
# map 必须放在 http 上下文，conf.d/*.conf 正是被包含在 http 里的。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端 SPA：所有路由回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理后端 API（单容器内后端在本机 127.0.0.1:9527）
    location /api/ {
        proxy_pass http://127.0.0.1:9527/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for 会保留客户端伪造的前缀、在末尾追加真实对端地址；
        # 后端从右往左取第一个非可信项，故伪造值不生效（前提：TRUSTED_PROXIES 包含 127.0.0.1）
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 握手
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 长连接不能 60s 就掐断
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}

